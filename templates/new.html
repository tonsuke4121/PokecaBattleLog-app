<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>新規戦績登録</title>
</head>
<body>

<h1>新規戦績登録</h1>

<form method="POST">
    <label>日付：</label>
    <input type="date" name="date" required><br><br>

    <label>自分のデッキ：</label>
    <input type="text" name="my_deck" required><br><br>

    <label>相手のデッキ：</label>
    <input type="text" name="opp_deck" required><br><br>

    <label>結果：</label>
    <select name="result">
        <option value="Win">Win</option>
        <option value="Lose">Lose</option>
    </select><br><br>

    <label>メモ：</label>
    <textarea name="memo"></textarea><br><br>

    <button type="submit">登録</button>
</form>

<a href="/">戻る</a>

</body>
</html>
